[theme]
base = "dark"
primaryColor = "#FF6A00"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#12161F"
textColor = "#E6EDF3"
borderColor = "#212836"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "9999px"

font = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

chartCategoricalColors = ["#FF6A00", "#FF8800", "#00A389", "#2563EB", "#7C3AED", "#FF4D4D", "#94A3B8"]

[theme.sidebar]
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#12161F"
textColor = "#E6EDF3"
borderColor = "#212836"
primaryColor = "#FF6A00"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
