[theme]
base = "light"
primaryColor = "#FF5C35"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#243342"
borderColor = "#DCE3EA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"

font = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
headingFontSizes = ["28px", "22px", "18px", "15px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

chartCategoricalColors = ["#FF5C35", "#10B981", "#3B82F6", "#F59E0B", "#EC4899", "#8B5CF6", "#64748B"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#243342"
borderColor = "#DCE3EA"
primaryColor = "#FF5C35"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
